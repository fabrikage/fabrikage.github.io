services:
  fabrikage:
    build: .
    container_name: fabrikage
    restart: unless-stopped
    networks:
      - proxy
    security_opt:
      - no-new-privileges:true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fabrikage.rule=Host(`fabrikage.nl`) || Host(`www.fabrikage.nl`)"
      - "traefik.http.routers.fabrikage.entrypoints=websecure"
      - "traefik.http.routers.fabrikage.tls.certresolver=letsencrypt"
      - "traefik.http.services.fabrikage.loadbalancer.server.port=80"

networks:
  proxy:
    external: true
